# Render Blueprint — SmartCrop / lead-notify API
# Dashboard: connect this repo, or sync Blueprint from render.yaml
services:
  - type: web
    name: lyasolution-node-email-server
    runtime: docker
    rootDir: server/whatsapp-lead-notify
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_KEY
        sync: false
      - key: CLIPDROP_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://www.lya-solution.com,https://lya-solution.com
