    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lya-lang');
          if (saved === 'he' || saved === 'en') {
            document.documentElement.lang = saved;
            document.documentElement.dir = saved === 'he' ? 'rtl' : 'ltr';
            return;
          }
        } catch (e) {}
        try {
          var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
          if (tz === 'Asia/Jerusalem' || tz === 'Asia/Tel_Aviv') {
            document.documentElement.lang = 'he';
            document.documentElement.dir = 'rtl';
            return;
          }
          var loc = (Intl.DateTimeFormat().resolvedOptions().locale || '').toLowerCase();
          if (loc.indexOf('he') === 0 || loc.indexOf('iw') === 0) {
            document.documentElement.lang = 'he';
            document.documentElement.dir = 'rtl';
            return;
          }
        } catch (e) {}
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';
      })();
    </script>
