<div class="sc-uploader" [attr.dir]="i18n.isRtl() ? 'rtl' : 'ltr'">
  @if (showSizePicker) {
    <label class="sc-uploader__size">
      <span>{{ i18n.t('smartcrop.upload.size') }}</span>
      <select
        [ngModel]="sizeName"
        (ngModelChange)="onSizeChange($event)"
        [disabled]="busy"
      >
        @for (group of sizeGroups(); track group.category) {
          <optgroup [label]="categoryLabel(group.category)">
            @for (s of group.sizes; track s.id) {
              <option [value]="s.name" [title]="s.description || ''">
                {{ s.name }}@if (s.description) { — {{ s.description }}}
              </option>
            }
          </optgroup>
        }
        @if (!sizes.length) {
          <option value="10x15 ס&quot;מ">10x15 ס"מ</option>
        }
      </select>
    </label>
  }

  <div
    class="sc-uploader__zone"
    [class.is-drag]="dragging()"
    [class.is-busy]="busy"
    (dragenter)="onDragEnter($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
  >
    <span class="material-symbols-outlined sc-uploader__ico" aria-hidden="true">cloud_upload</span>
    <p>{{ i18n.t('smartcrop.upload.drop') }}</p>
    <p class="sc-uploader__hint">{{ i18n.t('smartcrop.upload.hint') }}</p>
    <label class="sc-uploader__pick">
      {{ i18n.t('smartcrop.upload.pick') }}
      <input
        type="file"
        [accept]="accept"
        multiple
        hidden
        [disabled]="busy"
        (change)="onPick($event)"
      />
    </label>
  </div>
</div>
