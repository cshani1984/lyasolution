<article class="sc-card" [class.sc-card--selected]="selected">
  <label class="sc-card__check">
    <input type="checkbox" [checked]="selected" (change)="toggleSelect.emit()" />
  </label>

  <div class="sc-card__media">
    <img [src]="previewUrl()" [alt]="photo.target_size_name" loading="lazy" />
    <span class="sc-card__badge">{{ photo.target_size_name }} cm</span>
    <span class="sc-card__status" [attr.data-status]="photo.status">{{ photo.status }}</span>
  </div>

  <div class="sc-card__actions">
    <button type="button" class="sc-card__btn" (click)="togglePreview.emit()">
      {{ showOriginal ? i18n.t('smartcrop.card.crop') : i18n.t('smartcrop.card.original') }}
    </button>
    <button type="button" class="sc-card__btn sc-card__btn--icon" (click)="edit.emit()" [attr.aria-label]="i18n.t('smartcrop.card.edit')">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
      </svg>
    </button>
    <button type="button" class="sc-card__btn sc-card__btn--danger" (click)="remove.emit()" [attr.aria-label]="i18n.t('smartcrop.card.delete')">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
        <path d="M10 11v6M14 11v6" />
      </svg>
    </button>
  </div>
</article>
